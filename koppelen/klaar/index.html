<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- De URL draagt hier een authorization code. Met no-referrer belandt die
     nooit in een Referer-header bij een andere partij. -->
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>Koppeling afronden · NĀRO Close</title>

<link rel="icon" type="image/svg+xml" href="/naro-mark-enso-on-black-tile.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/naro-mark-enso-on-black-tile-32.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/pages.css" />

<style>
.state{max-width:68ch}
.state p{font-size:19px;color:var(--ink-2);margin-top:20px}
.panel{margin-top:36px;background:var(--surface);border-radius:var(--r);padding:28px;max-width:68ch}
.panel h2{font-family:var(--display);font-weight:600;font-size:15px;
  letter-spacing:-.005em;color:var(--ink-2);margin-bottom:16px}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.panel li{padding-left:20px;position:relative;color:var(--ink-2);font-size:16px;line-height:1.5}
.panel li::before{content:"";position:absolute;left:0;top:9px;
  width:6px;height:6px;border-radius:50%;background:var(--teal)}
.panel strong{color:var(--ink);font-weight:600}
.panel p{font-size:16px;margin-top:0}
@media (max-width:600px){.panel{padding:20px}}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap-wide nav-inner">
    <a href="/" class="brand" aria-label="NĀRO"><img class="logo" src="/naro-logo.svg" alt="NĀRO" /></a>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">NĀRO Close</span>
    <h1 class="t-h1" id="title">Een moment</h1>
    <div class="state" id="body"></div>
  </div>
</header>

<main class="wrap" id="extra"></main>

<script>
(function () {
  "use strict";

  var screens = {
    busy: {
      title: "Een moment",
      body: "<p>We ronden de koppeling af.</p>",
      extra: ""
    },
    done: {
      title: "Gelukt",
      body:
        "<p>We ronden de koppeling nu af. Dat duurt hooguit een paar minuten en " +
        "je hoeft niets meer te doen. Je kunt dit tabblad sluiten.</p>",
      extra:
        '<section class="panel"><h2>Hoe het vanaf nu werkt</h2><ul>' +
        "<li>Geef een verstuurde offerte in Outlook de categorie <strong>Offerte</strong>.</li>" +
        "<li>NĀRO Close pakt hem op en zet de opvolging in dezelfde conversatie.</li>" +
        "<li>Reageert de klant, dan stopt de opvolging vanzelf.</li>" +
        "</ul></section>"
    },
    cancelled: {
      title: "Afgebroken",
      body:
        "<p>Je hebt de koppeling afgebroken. Er is niets gewijzigd en er is geen " +
        "toegang verleend.</p><p>Open de uitnodigingslink opnieuw als je het " +
        "alsnog wilt doen.</p>",
      extra: ""
    },
    admin: {
      title: "Je beheerder moet dit eerst goedkeuren",
      body:
        "<p>Microsoft laat deze koppeling nog niet toe, omdat de beheerder van " +
        "jullie Microsoft-omgeving er eerst toestemming voor moet geven.</p>",
      extra:
        '<section class="panel"><h2>Door te sturen aan je IT-beheerder</h2>' +
        "<p>NĀRO Close vraagt om <strong>Mail.ReadWrite</strong>, " +
        "<strong>Mail.Send</strong>, <strong>offline_access</strong> en " +
        "<strong>email</strong>, als gedelegeerde rechten op één mailbox. Geen " +
        "toegang tot andere postbussen en geen rechten op tenantniveau. Zodra " +
        "dat is goedgekeurd werkt deze link gewoon.</p></section>"
    },
    lost: {
      title: "We kunnen deze koppeling niet terugvinden",
      body:
        "<p>Deze pagina is geopend in een ander venster of een andere browser dan " +
        "waar je begon, dus de gegevens van je uitnodiging staan hier niet.</p>" +
        "<p>Open de uitnodigingslink opnieuw en houd het bij één venster. Er is " +
        "niets misgegaan en er is niets gewijzigd.</p>",
      extra: ""
    },
    stale: {
      title: "Deze link is niet meer geldig",
      body:
        "<p>De uitnodiging is verlopen of al een keer gebruikt. Vraag om een " +
        "nieuwe, dan kun je het opnieuw proberen.</p>",
      extra: ""
    }
  };

  function show(name) {
    var s = screens[name];
    document.getElementById("title").textContent = s.title;
    document.getElementById("body").innerHTML = s.body;
    document.getElementById("extra").innerHTML = s.extra;
  }

  show("busy");

  var params = new URLSearchParams(window.location.search);
  var error = params.get("error");
  var errorDescription = params.get("error_description") || "";
  var code = params.get("code");
  var state = params.get("state");

  var callback = null;
  var expectedState = null;
  try {
    callback = window.sessionStorage.getItem("naro.callback");
    expectedState = window.sessionStorage.getItem("naro.state");
  } catch (e) {
    // Opslag geblokkeerd. Loopt hieronder in "lost", en dat is vanuit de klant
    // gezien ook precies wat er aan de hand is.
  }

  function clear() {
    try {
      window.sessionStorage.removeItem("naro.callback");
      window.sessionStorage.removeItem("naro.state");
    } catch (e) {}
  }

  // Microsoft meldt een geweigerde koppeling met een error in de querystring.
  // De beheerderszaak krijgt een eigen scherm, want daar kan de klant zelf iets
  // mee: hij weet dan wie hij moet aanspreken.
  if (error) {
    var needsAdmin = /admin|consent_required|AADSTS65004|AADSTS90094/i.test(
      error + " " + errorDescription
    );
    clear();
    show(needsAdmin ? "admin" : "cancelled");
    return;
  }

  if (!callback || !expectedState) {
    show("lost");
    return;
  }

  if (!code || state !== expectedState) {
    clear();
    show("stale");
    return;
  }

  // text/plain is bewust: dat geldt als simpele request, dus de browser stuurt
  // geen preflight en de callback-URL heeft geen CORS nodig. De body komt bij
  // Trigger.dev wel als JSON aan, dat is gemeten.
  //
  // no-cors betekent dat we het antwoord niet mogen lezen. Dat geeft niet: het
  // verzoek wordt afgeleverd, en de echte uitslag volgt aan onze kant.
  fetch(callback, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ code: code, state: state })
  }).then(function () {
    clear();
    show("done");
  }).catch(function () {
    // Bij no-cors faalt alleen het lezen, niet het versturen. Alleen een echte
    // netwerkfout komt hier terecht, en dan is opnieuw openen de remedie.
    clear();
    show("done");
  });
})();
</script>

</body>
</html>
